name: Sleeper weekly pull

# Schedule (UTC; Sydney is UTC+11 in season). GitHub often starts scheduled
# runs hours late, so each slot has backups; extra runs just refresh the data.
#   Monday snapshot (Sunday games done, Monday night still to come):
#     05:37 UTC = 4:37pm Mon Sydney, backup 07:52 UTC
#   Week final (Monday night game done):
#     Tue 05:17, 07:47, 11:23, 16:41 UTC and Wed 01:13 UTC
#     = Tue 4:17pm, 6:47pm, 10:23pm, Wed 3:41am, 12:13pm Sydney
# Also runs on demand and when the scripts or the site change.
on:
  schedule:
    - cron: "37 5 * * 1"
    - cron: "52 7 * * 1"
    - cron: "17 5 * * 2"
    - cron: "47 7 * * 2"
    - cron: "23 11 * * 2"
    - cron: "41 16 * * 2"
    - cron: "13 1 * * 3"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sleeper/*.py"
      - "sleeper/config.json"
      - "sleeper/franchise_map.csv"
      - "sleeper/site/**"
      - ".github/workflows/sleeper-weekly.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sleeper-weekly
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull Sleeper data
        run: python sleeper/pull_sleeper.py

      - name: Rebuild workbook and Almanac data
        run: |
          if [ -f sleeper/build.py ] && [ -f sleeper/franchise_map.csv ]; then
            pip install --quiet openpyxl==3.1.5
            python sleeper/build.py
          else
            echo "Build step not set up yet; raw data only."
          fi

      - name: Commit changes
        run: |
          git config user.name "tgl-almanac-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sleeper/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Sleeper weekly pull $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Assemble the Almanac site
        run: |
          mkdir -p _site
          cp sleeper/site/index.html sleeper/site/almanac.dc.html _site/
          cp sleeper/output/almanac.json _site/
          if [ -d sleeper/output/img ]; then cp -r sleeper/output/img _site/img; fi
          cp sleeper/output/Sunday_Club_League_History.xlsx _site/TGL_League_History.xlsx
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: pull
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
